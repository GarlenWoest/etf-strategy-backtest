# trading-research configuration. Single source of truth for every phase.
# Changing anything below after Phase 2 starts must be logged in PROGRESS.md.

project:
  random_seed: 20261022            # used by bootstrap, Monte Carlo, block bootstrap
  timezone: America/New_York

capital:
  starting_usd: 100.0
  target_usd: 1000.0               # first close at or above this switches on the Phase 7B risk layer, permanently
  ruin_usd: 20.0                   # "fell to $20" threshold used in Phase 6 stress test and Phase 7A odds
  monthly_contributions_usd: [0, 50, 100]   # Phase 7A scenarios
  fractional_shares: true
  min_order_usd: 1.0

dates:
  common_start: "2004-11-18"       # GLD's first trading day in Yahoo data (launch day, full session, 6.0M shares)
  evaluation_start: "2006-01-03"   # first trading day of 2006: every lookback (max 12 months / 13 month-ends) is filled; signals warm up from common_start
  in_sample_end: "2018-12-31"
  validation_start: "2019-01-01"
  validation_end: "2023-12-31"
  holdout_start: "2024-01-01"
  holdout_locked: true             # only the user typing "open the holdout" may change this

instruments:
  unleveraged: [GLD, SPY, QQQ, TLT]
  leveraged:
    # expense ratios from issuer pages read 2026-10-22 (research/sources.csv)
    UGL:  {underlying: GLD, leverage: 2, expense_ratio: 0.0095, source: "ProShares UGL page (S20)",
           note: "tracks 2x Bloomberg Gold Subindex (gold FUTURES), not GLD; commodity pool, issues a K-1"}
    UPRO: {underlying: SPY, leverage: 3, expense_ratio: 0.0088, source: "ProShares UPRO page (S18)"}
    TQQQ: {underlying: QQQ, leverage: 3, expense_ratio: 0.0094, source: "ProShares TQQQ page (S19), GROSS per user decision"}
    TMF:  {underlying: TLT, leverage: 3, expense_ratio: 0.0101, source: "SEC 497K summary prospectus 2026-02-27 (EDGAR 0001193125-26-078552): gross 1.01%, net 0.90% after cap through 2027-09-01; GROSS used, consistent with TQQQ"}
  cash_rate:
    ticker: "^IRX"                 # 13-week T-bill, annual percent
    daily_rate_formula: "(IRX / 100) / 252"
    forward_fill: market_holidays_only

synthetic_leverage:
  formula: "L * r_underlying - expense_ratio/252 - (L - 1) * (irx/100) / 252 - extra_drag/252"
  extra_drag: "per fund, = mean daily (synthetic - real) return x 252 on overlap through dates.in_sample_end (user decision 2026-10-22, option ii)"
  use_real_data_where_available: true
  report_tracking_error_over_overlap: true

data:
  source: yfinance
  auto_adjust: true                # fully adjusted OHLC; never mix adjusted closes with unadjusted opens
  crosscheck_source: none          # Stooq blocked by bot verification; user chose option C (skip), 2026-10-22
  suspect_prices:                  # unresolved suspected Yahoo stale closes (no second source)
    QQQ: ["2012-08-27", "2012-08-29"]   # inclusive window
    UGL: ["2018-05-18", "2018-05-22"]
  phase5_suspect_sensitivity: "run every surviving strategy twice: as is, and with suspect closes replaced by linear interpolation from neighboring closes; report any change"
  crosscheck_mismatch_flag: 0.005
  gap_flag: 0.10                   # flag (keep) single-day moves over 10%
  raw_dir: data/raw
  clean_dir: data/clean

execution:
  signal_time: close
  fill_time: next_open
  long_only: true
  margin: false

costs:
  commission_usd: 0.0
  half_spread:
    unleveraged: 0.0002            # GLD, SPY, QQQ, TLT
    leveraged: 0.0005              # UGL, UPRO, TQQQ, TMF
  slippage: 0.0005
  sensitivity_multipliers: [1, 2, 3]

risk:
  aggressive_mode:                 # below target_usd: NO risk management of any kind (user, 2026-10-22)
    stop_loss: none
    per_trade_loss_limit: none
    drawdown_kill_switch: none
    max_concentration: 1.0
  phase_7b:                        # from first close >= target_usd, permanently
    max_loss_per_trade: 0.02
    max_weight_any_instrument: 0.50
    max_weight_single_leveraged_etf: 0.30
    drawdown_kill_from_post_threshold_peak: 0.20

validation:
  walk_forward: {train_years: 5, test_years: 1, last_test_end: "2023-12-31"}
  bootstrap: {resamples: 10000, method: daily_returns}
  monte_carlo: {paths: 10000, block_length_days: 20, horizons_years: [1, 2, 3]}
  phase5_risk_layer: false         # user decision 2026-10-22: trials evaluated with the $1,000 switch OFF
  phase7a_position_sizes: [0.20, 0.50, 1.00]   # user decision 2026-10-22: fraction of account per trade below $1,000;
                                               # remainder earns T-bills; analysis scenarios, NOT extra trials
  stress_periods:
    gfc_2008: ["2008-01-01", "2008-12-31"]
    covid_crash_2020: ["2020-02-19", "2020-03-23"]
    stocks_and_bonds_2022: ["2022-01-01", "2022-12-31"]
  kill_criteria:
    beat_buy_and_hold_same_instrument_and_equal_weight_oos_sharpe: true
    min_deflated_sharpe_probability: 0.95
    must_be_profitable_at_2x_costs_if_profitable_at_1x: true
    min_oos_trades: 30
    min_oos_years_for_monthly_rotation: 5
    edge_survives_one_grid_step: true
    min_oos_to_is_sharpe_ratio: 0.5
    max_stress_drawdown: 0.80      # $100 -> $20

taxes:                              # EXAMPLE DEFAULTS, not tax advice. Example: 12% federal, 2.75% Ohio. Change for your situation.
  federal_ordinary_rate: 0.12      # example: 12% federal ordinary-income bracket (change for your situation)
  federal_long_term_rate: 0.00     # example: 0% long-term capital gains rate, which applies at the 12% bracket (change for your situation)
  ohio_rate: 0.0275                # example state rate: Ohio 2.75% (ORC 5747.02, 2026+: 0% up to $26,050, 2.75% above). Change for your state
  ohio_taxes_long_term_as_ordinary: true   # example-state rule: Ohio taxes long-term gains as ordinary income
  short_term_holding_days: 365     # held one year or less = short-term
  section_1256_like_60_40: [UGL]   # modelling choice: UGL futures gains taxed 60% long-term / 40% short-term
  flag_wash_sales: true
  report_flags: ["UGL issues a K-1 (commodity pool)"]

strategies:                         # FROZEN 2026-10-22. 92 trials; pre-registered as V001-V092 in research_log.csv
  frozen: true
  total_trials: 92
  benchmarks: [buy_and_hold each of 8 ETFs, equal_weight GLD/SPY/QQQ/TLT monthly]   # B01-B09, not trials
  signals_from_unleveraged_etf: true
  S2_trend_ma:            {N_days: [50, 100, 200], instruments: [GLD, SPY, QQQ, TLT], leveraged_versions: true}       # 24
  S3_tsmom:               {lookback_months: [3, 6, 12], instruments: [GLD, SPY, QQQ, TLT], leveraged_versions: true} # 24
  S4_rsi2:                {entry_rsi_below: [5, 10, 15], exit: close_above_sma5, instruments: [SPY, QQQ], leveraged_versions: true}  # 12
  S5_rotation:            {lookback_months: [3, 6, 12], rebalance: monthly, cash_if_all_negative: true, hold: winner_1x}   # 3
  S6_leveraged_rotation:  {lookback_months: [3, 6, 12], rebalance: monthly, cash_if_all_negative: true, hold: winner_leveraged}  # 3
  P1_vol_gated_leverage:  {sma_days: 200, vol_window_days: 20, vol_threshold: [0.15, 0.20, 0.25], pairs: [[SPY, UPRO], [QQQ, TQQQ]]}  # 6
  P2_multi_asset_trend:   {sma_months: [6, 8, 10, 12], weight_each: 0.25, rebalance: monthly, leveraged_versions: true}  # 8
  P3_rsi2_trend_filter:   {entry_rsi_below: [5, 10, 15], trend_filter_sma_days: 200, exit: close_above_sma5, instruments: [SPY, QQQ], leveraged_versions: true}  # 12
